services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    volumes:
      - ./:/app
      - rvg-data:/data
    command:
      - sh
      - -ec
      - exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "3000:8000"
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/login", timeout=4) as r:
                  ok = r.status == 200
          except Exception as e:
              print("health: request failed:", e)
              sys.exit(1)
          print("health: /login", "ok" if ok else "bad status")
          sys.exit(0 if ok else 1)
      interval: 15s
      timeout: 6s
      start_period: 45s
      retries: 5
    restart: on-failure
    labels:
      base44.project: "RVG Gateway"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  rvg-data:
