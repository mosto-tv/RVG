# Base44 development environment for RIA ROLEPLAY (site + Tebex store).
# Runs the cloned source with live reload; never a prebuilt production image.
name: velora-estates

services:
  api:
    image: node:24-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --loglevel=error && exec node index.js
    volumes:
      - ./velora/server:/app
      - velora-api-modules:/app/node_modules
      # Mounted outside ./data so the repo's source data module stays visible.
      - velora-data:/app/.data
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATA_DIR=/app/.data
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
    env_file:
      # Placeholders only. The platform-managed file below is listed last so a
      # real credential from the dashboard always wins.
      - path: ./velora/.env.base44-defaults
        required: true
      - path: /run/base44/app.env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

  web:
    image: node:24-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --loglevel=error && exec npx vite --host 0.0.0.0 --port 5173
    volumes:
      - ./velora:/app
      - velora-web-modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - API_PROXY_TARGET=http://api:4000
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: "RIA ROLEPLAY"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  velora-data:
  velora-api-modules:
  velora-web-modules:
